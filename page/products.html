<div class="toolbar"><button id="addProduct">+ إضافة منتج</button><input id="productSearch" type="search" placeholder="بحث عن منتج..."><span id="productCount" class="muted"></span></div><div class="tablewrap"><table><thead><tr><th>الصورة</th><th>المنتج</th><th>الصنف</th><th>السعر</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="productRows"></tbody></table></div><dialog id="productDialog" class="edit-dialog"><form id="productForm" class="editform"><input type="hidden" name="id"><h3 id="productDialogTitle">تعديل المنتج</h3><label>اسم المنتج<input name="name" required></label><label>الصنف<select name="category_id" required></select></label><label>السعر بالدينار<input name="price_iqd" type="number" min="0" required></label><label>الترتيب<input name="sort_order" type="number" value="0"></label><label>الحالة<select name="is_available"><option value="true">متوفر</option><option value="false">غير متوفر</option></select></label><label>صورة المنتج<input id="productImage" type="file" accept="image/*"><small>تُحوّل تلقائياً إلى WebP قبل الرفع (حد 5MB)</small></label><label class="wide">أو رابط صورة<input name="image_url" type="url" placeholder="https://..."></label><div class="wide image-preview"><img id="productPreview" alt="معاينة الصورة" hidden></div><div class="dialog-actions wide"><button type="button" id="cancelProduct" class="secondary">إلغاء</button><button id="saveProduct" type="submit">حفظ المنتج</button></div></form></dialog>
