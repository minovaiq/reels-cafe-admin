<section class="card" style="padding:12px;margin-top:12px"><h3 style="margin:0 0 10px">المبيعات اليومية</h3><div class="daily-filter-wrap"><label>من تاريخ <input id="dailyFrom" type="date" style="display:block;max-width:155px"></label><label>إلى تاريخ <input id="dailyTo" type="date" style="display:block;max-width:155px"></label><button id="dailyApply" type="button">عرض</button></div><p id="dailyError" class="muted" role="status"></p><div id="dailyRows" class="daily-sales-grid"><p class="muted">جاري تحميل المبيعات...</p></div><div style="margin-top:10px;font-weight:800">إجمالي مبيعات الفترة: <span id="dailyTotal">—</span></div></section><div id="monthlyFinance" class="monthly-finance"><p class="muted">جاري تحميل الحسابات...</p></div><p class="muted note">هذه الأرقام تعتمد على الطلبات غير الملغاة والمصروفات المسجلة في لوحة التحكم. الباقي هو صافي المبيعات بعد المصروفات المسجلة، وليس الربح المحاسبي إذا كانت هناك تكاليف أخرى غير مسجلة.</p><style>.daily-sales-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px;margin-top:12px}.daily-sale-card{border:1px solid #e9ddd2;background:#fffaf5;border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:7px;box-shadow:0 2px 8px #3c1d0d09}.daily-sale-card .day-date{font-size:12px;color:#79675c;font-weight:700}.daily-sale-card .day-amount{font-size:17px;color:#9e3036;font-weight:800;overflow-wrap:anywhere}.daily-sale-card .day-count{font-size:11px;color:#8b786c}.daily-sale-card.no-sales{opacity:.67;background:#f9f6f2}.daily-filter-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.daily-filter-wrap input{font-size:16px;max-width:155px;width:100%}@media(max-width:380px){.daily-sales-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.daily-sale-card{padding:9px}.daily-sale-card .day-amount{font-size:14px}}</style>
