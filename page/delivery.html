<div class="toolbar"><button id="addArea">+ إضافة منطقة</button><span class="muted">حدّد أجرة التوصيل وأرقام المندوبين لكل منطقة</span></div><div id="deliveryAreas" class="delivery-grid"></div><dialog id="areaDialog" class="edit-dialog"><form id="areaForm" class="editform"><input type="hidden" name="id"><h3 id="areaDialogTitle">منطقة توصيل</h3><label>اسم المنطقة<input name="name" required></label><label>أجرة التوصيل بالدينار<input name="delivery_price" type="number" min="0" required></label><label>الترتيب<input name="sort_order" type="number" value="0"></label><label>الحالة<select name="is_active"><option value="true">فعالة</option><option value="false">معطلة</option></select></label><div class="dialog-actions"><button type="button" id="cancelArea" class="secondary">إلغاء</button><button type="submit" id="saveArea">حفظ المنطقة</button></div></form></dialog><dialog id="courierDialog" class="edit-dialog"><form id="courierForm" class="editform"><input type="hidden" name="id"><input type="hidden" name="area_id"><h3 id="courierTitle">إضافة مندوب</h3><label>اسم المندوب<input name="contact_name" required></label><label>رقم الهاتف<input name="phone" type="tel" required inputmode="tel" pattern="[+0-9 -]{7,20}"></label><label>الترتيب<input name="sort_order" type="number" value="0"></label><div class="dialog-actions"><button type="button" id="cancelCourier" class="secondary">إلغاء</button><button type="submit" id="saveCourier">حفظ الرقم</button></div></form></dialog>
